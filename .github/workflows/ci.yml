name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-document-assistant
    env:
      DATABASE_URL: postgresql+psycopg://rag_app:rag_app_local@localhost:55432/rag_credit
      MODEL_BASE_URL: http://127.0.0.1:9999/v1
      MODEL_API_KEY: ci-test-key
      LLM_MODEL: ci-test-chat
      EMBEDDING_MODEL: ci-test-embedding
      EMBEDDING_DIMENSION: '768'
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: rag_credit
          POSTGRES_USER: rag_app
          POSTGRES_PASSWORD: rag_app_local
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rag_app -d rag_credit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rag-document-assistant/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Check for model and migration drift
        run: python -m alembic check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run PostgreSQL integration tests
        env:
          RUN_DATABASE_TESTS: '1'
        run: python -m unittest tests.test_document_repository_integration tests.test_api_postgres_integration -v
